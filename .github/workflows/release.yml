name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build-binaries:
    name: Build ${{ matrix.binary }}
    strategy:
      # Don't cancel the rest of the matrix if one arch fails. A single
      # cross-compile blip should not block npm publish, homebrew update,
      # or skill sync for the other 5 working artifacts.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary: elnora-linux-x64
          - os: ubuntu-latest
            target: linux-arm64
            binary: elnora-linux-arm64
          - os: macos-latest
            target: macos-x64
            binary: elnora-macos-x64
          - os: macos-latest
            target: macos-arm64
            binary: elnora-macos-arm64
          - os: windows-latest
            target: win-x64
            binary: elnora-win-x64.exe
          # win-arm64 must build on a native ARM64 runner. pkg fabricates the
          # binary by spawning it during packaging — Windows on x64 cannot
          # execute ARM64 EXEs (no Prism on the x64 host side), so cross-
          # compile from windows-latest fails with `spawn UNKNOWN`.
          - os: windows-11-arm
            target: win-arm64
            binary: elnora-win-arm64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build.mjs

      - name: Build binary
        run: npx pkg dist/cli.cjs --target node22-${{ matrix.target }} --output dist/${{ matrix.binary }}

      - name: Archive
        shell: bash
        run: |
          # Copy skills into dist/ for bundling
          cp -r skills dist/skills
          cd dist
          if [[ "${{ matrix.target }}" == win-* ]]; then
            7z a ${{ matrix.binary }}.zip ${{ matrix.binary }} skills
          else
            tar -czf ${{ matrix.binary }}.tar.gz ${{ matrix.binary }} skills
          fi

      - name: Generate SHA256
        shell: bash
        run: |
          cd dist
          if [[ "${{ matrix.target }}" == win-* ]]; then
            ARCHIVE="${{ matrix.binary }}.zip"
          else
            ARCHIVE="${{ matrix.binary }}.tar.gz"
          fi
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE" > ${{ matrix.binary }}.sha256
          else
            shasum -a 256 "$ARCHIVE" > ${{ matrix.binary }}.sha256
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ matrix.binary }}.tar.gz
            dist/${{ matrix.binary }}.zip
            dist/${{ matrix.binary }}.sha256

  publish-npm:
    name: Publish to npm
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - name: Sync version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME##*-v}"
          echo "Publishing version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke-test:
    name: "Smoke Test (${{ matrix.os }})"
    needs: publish-npm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Extract version from tag
        id: ver
        shell: bash
        # Non-greedy strip of leading "v" — matches the sync-skills job pattern.
        # The greedy form (##*-v) would silently break pre-release tags like v1.0.0-beta.1.
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for npm propagation
        shell: bash
        run: sleep 30

      - name: Install CLI from npm
        run: npm install -g @elnora-ai/cli@${{ steps.ver.outputs.VERSION }}

      - name: Run smoke test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          SMOKE_TEST_API_KEY: ${{ secrets.SMOKE_TEST_API_KEY }}
        run: bash scripts/smoke-test-coldstart.sh

      - name: Run smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SMOKE_TEST_API_KEY: ${{ secrets.SMOKE_TEST_API_KEY }}
        run: .\scripts\smoke-test-coldstart.ps1

  update-homebrew:
    name: Update Homebrew Tap
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v6
        with:
          repository: Elnora-AI/homebrew-cli
          token: ${{ secrets.RELEASE_BOT_PAT }}

      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF_NAME##*-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Updating Homebrew formula to $VERSION"

      - name: Download checksums from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="https://github.com/Elnora-AI/elnora-cli/releases/download/${{ github.event.release.tag_name }}"
          for asset in elnora-macos-arm64 elnora-macos-x64 elnora-linux-arm64 elnora-linux-x64; do
            SHA=$(curl -sL "$BASE/$asset.sha256" | awk '{print $1}')
            VARNAME=$(echo "${asset}" | tr '-' '_')
            echo "${VARNAME}_sha256=$SHA" >> "$GITHUB_ENV"
            echo "$asset: $SHA"
          done

      - name: Update formula
        run: |
          FORMULA="Formula/elnora.rb"

          # Update version
          sed -i "s/version \".*\"/version \"$VERSION\"/" "$FORMULA"

          # Update checksums (match the sha256 line after each url line)
          sed -i "/elnora-macos-arm64\.tar\.gz/,/sha256/{s/sha256 \".*\"/sha256 \"${elnora_macos_arm64_sha256}\"/}" "$FORMULA"
          sed -i "/elnora-macos-x64\.tar\.gz/,/sha256/{s/sha256 \".*\"/sha256 \"${elnora_macos_x64_sha256}\"/}" "$FORMULA"
          sed -i "/elnora-linux-arm64\.tar\.gz/,/sha256/{s/sha256 \".*\"/sha256 \"${elnora_linux_arm64_sha256}\"/}" "$FORMULA"
          sed -i "/elnora-linux-x64\.tar\.gz/,/sha256/{s/sha256 \".*\"/sha256 \"${elnora_linux_x64_sha256}\"/}" "$FORMULA"

          echo "Updated formula:"
          cat "$FORMULA"

      - name: Commit and push
        run: |
          git config user.name "elnora-bot"
          git config user.email "bot@elnora.ai"
          git add Formula/elnora.rb
          git commit -m "Update elnora to $VERSION"
          git push

  sync-skills:
    name: Sync Skills to elnora-plugins
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLI repo (source of truth for skills)
        uses: actions/checkout@v6

      - name: Checkout plugins repo
        uses: actions/checkout@v6
        with:
          repository: Elnora-AI/elnora-plugins
          token: ${{ secrets.RELEASE_BOT_PAT }}
          path: elnora-plugins

      - name: Sync skills and update versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing skills and updating version to $VERSION"

          # Copy skill files
          for skill in elnora-admin elnora-agent elnora-files elnora-folders elnora-orgs elnora-platform elnora-projects elnora-search elnora-tasks; do
            cp "skills/$skill/SKILL.md" "elnora-plugins/elnora/skills/$skill/SKILL.md"
          done

          # Update plugin.json version
          cd elnora-plugins
          jq --arg v "$VERSION" '.version = $v' \
            elnora/.claude-plugin/plugin.json > tmp.json && mv tmp.json elnora/.claude-plugin/plugin.json
          jq --arg v "$VERSION" '.metadata.version = $v' \
            .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json

      - name: Commit and push
        run: |
          cd elnora-plugins
          git config user.name "elnora-bot"
          git config user.email "bot@elnora.ai"
          git add elnora/skills/ elnora/.claude-plugin/plugin.json .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "Sync skills and version from elnora-cli ${{ github.event.release.tag_name }}"
            git push
          fi
