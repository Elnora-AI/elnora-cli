[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elnora"
version = "0.1.0"
description = "CLI for the Elnora AI platform"
requires-python = ">=3.10"
dependencies = ["click>=8.1"]
license = "Apache-2.0"

[project.scripts]
elnora = "elnora.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elnora"]
