name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build-binaries:
    name: Build ${{ matrix.binary }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary: elnora-linux-x64
          - os: ubuntu-latest
            target: linux-arm64
            binary: elnora-linux-arm64
          - os: macos-latest
            target: macos-x64
            binary: elnora-macos-x64
          - os: macos-latest
            target: macos-arm64
            binary: elnora-macos-arm64
          - os: windows-latest
            target: win-x64
            binary: elnora-win-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build.mjs

      - name: Build binary
        run: npx pkg dist/cli.cjs --target node20-${{ matrix.target }} --output dist/${{ matrix.binary }}

      - name: Archive
        shell: bash
        run: |
          cd dist
          if [[ "${{ matrix.target }}" == "win-x64" ]]; then
            7z a ${{ matrix.binary }}.zip ${{ matrix.binary }}
          else
            tar -czf ${{ matrix.binary }}.tar.gz ${{ matrix.binary }}
          fi

      - name: Generate SHA256
        shell: bash
        run: |
          cd dist
          if [[ "${{ matrix.target }}" == "win-x64" ]]; then
            ARCHIVE="${{ matrix.binary }}.zip"
          else
            ARCHIVE="${{ matrix.binary }}.tar.gz"
          fi
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE" > ${{ matrix.binary }}.sha256
          else
            shasum -a 256 "$ARCHIVE" > ${{ matrix.binary }}.sha256
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.binary }}.tar.gz
            dist/${{ matrix.binary }}.zip
            dist/${{ matrix.binary }}.sha256

  publish-npm:
    name: Publish to npm
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - name: Sync version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME##*-v}"
          echo "Publishing version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-homebrew:
    name: Update Homebrew Tap
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v6
        with:
          repository: Elnora-AI/homebrew-cli
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF_NAME##*-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Updating Homebrew formula to $VERSION"

      - name: Download checksums from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="https://github.com/Elnora-AI/elnora-cli/releases/download/${{ github.event.release.tag_name }}"
          for asset in elnora-macos-arm64 elnora-macos-x64 elnora-linux-arm64 elnora-linux-x64; do
            SHA=$(curl -sL "$BASE/$asset.sha256" | awk '{print $1}')
            VARNAME=$(echo "${asset}" | tr '-' '_')
            echo "${VARNAME}_sha256=$SHA" >> "$GITHUB_ENV"
            echo "$asset: $SHA"
          done

      - name: Update formula
        run: |
          FORMULA="Formula/elnora.rb"

          # Update version
          sed -i "s/version \".*\"/version \"$VERSION\"/" "$FORMULA"

          # Update checksums (match the sha256 line after each url line)
          sed -i "/elnora-macos-arm64\.tar\.gz/,/sha256/{s/sha256 \".*\"/sha256 \"${elnora_macos_arm64_sha256}\"/}" "$FORMULA"
          sed -i "/elnora-macos-x64\.tar\.gz/,/sha256/{s/sha256 \".*\"/sha256 \"${elnora_macos_x64_sha256}\"/}" "$FORMULA"
          sed -i "/elnora-linux-arm64\.tar\.gz/,/sha256/{s/sha256 \".*\"/sha256 \"${elnora_linux_arm64_sha256}\"/}" "$FORMULA"
          sed -i "/elnora-linux-x64\.tar\.gz/,/sha256/{s/sha256 \".*\"/sha256 \"${elnora_linux_x64_sha256}\"/}" "$FORMULA"

          echo "Updated formula:"
          cat "$FORMULA"

      - name: Commit and push
        run: |
          git config user.name "elnora-bot"
          git config user.email "bot@elnora.ai"
          git add Formula/elnora.rb
          git commit -m "Update elnora to $VERSION"
          git push
